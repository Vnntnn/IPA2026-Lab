interfaces:
  - name: "g0/1"
    ip: "192.168.1.1"
    mask: "255.255.255.0"
    status: "no shutdown"
    nat: "none"
  - name: "g0/2"
    ip: "172.16.1.2"
    mask: "255.255.255.252"
    status: "no shutdown"
    nat: "none"
  - name: "lo1"
    ip: "100.0.0.1"
    mask: "255.255.255.255"
    status: "no shutdown"
    nat: "none"
routes:
 - type: static
   destination: "172.31.14.0"
   mask: "255.255.255.240"
   next-hop: "Null0"
 - type: dynamic
   ospf:
   - id: 1
     vrf: "control-data"
     router: 
     - network:
       ip: "192.168.1.0"
       wildcard: "0.0.0.255"
       area: 0
     - network:
       ip: "172.16.1.0"
       wildcard: "0.0.0.3"
       area: 0
     - network:
       ip: "100.0.0.1"
       wildcard: "0.0.0.0"
       area: 0
acls:
  - name: "remote"
    type: "standard"
    permits:
      - ip: "172.31.14.0"
        wildcard: "0.0.0.15"
      - ip: "10.30.6.0"
        wildcard: "0.0.1.255"
nameservers:
  vrf: "control-data"
  ip: 172.16.1.1
